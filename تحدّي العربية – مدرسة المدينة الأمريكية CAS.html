<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تحدّي العربية – مدرسة المدينة الأمريكية CAS</title>
<style>
:root{--n:#14305c;--n2:#1d4380;--n3:#0e2447;--o:#ff8a1f;--w:#fff;--g:#2ecc71;--r:#e74c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at top,var(--n2),var(--n3));color:var(--w);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--n3);border-bottom:4px solid var(--o);padding:12px;text-align:center;font-weight:700;font-size:1.15rem}
header small{display:block;color:var(--o);font-size:.85rem;margin-top:2px}
footer{background:var(--n3);border-top:3px solid var(--o);padding:10px;text-align:center;font-size:.85rem;margin-top:auto}
main{max-width:1000px;width:100%;margin:0 auto;padding:16px}
.card{background:var(--n);border:2px solid var(--n2);border-radius:16px;padding:18px;box-shadow:0 6px 18px #0005}
.home{text-align:center}.home h1{color:var(--o);margin:.2em 0}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin:10px}
.paths{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.path{flex:1;min-width:200px;cursor:pointer;background:var(--n2);border:3px solid var(--o);border-radius:16px;padding:18px;font-size:1.3rem;font-weight:700;color:#fff;transition:.2s}
.path:hover{transform:translateY(-4px);background:var(--o);color:var(--n3)}.path small{display:block;font-weight:400;font-size:.85rem;margin-top:6px}
.btn{background:var(--o);color:var(--n3);border:0;border-radius:10px;padding:10px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.95rem;margin-bottom:8px}
.tb{height:10px;background:var(--n3);border-radius:8px;overflow:hidden;margin-bottom:12px}.tb i{display:block;height:100%;background:var(--o);width:100%;transition:width 1s linear}
.grid{display:grid;grid-template-columns:1fr;gap:14px}.grid.p{grid-template-columns:5fr 6fr}
@media(max-width:760px){.grid.p{grid-template-columns:1fr}}
.pass{background:#fff;color:#1a1a2e;border-radius:14px;padding:14px;line-height:2;max-height:70vh;overflow:auto;position:sticky;top:8px;align-self:start;border-right:6px solid var(--o)}
.pass h4{margin:0 0 6px;color:var(--n)}
.q{font-size:1.15rem;font-weight:700;margin-bottom:12px;line-height:1.8}
.opt{display:block;width:100%;text-align:right;background:var(--n2);color:#fff;border:2px solid transparent;border-radius:12px;padding:12px;margin:8px 0;font-size:1rem;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--o)}.opt.ok{background:var(--g);color:#06361b}.opt.no{background:var(--r)}
.pool{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;min-height:44px}
.chip{background:var(--o);color:var(--n3);padding:8px 14px;border-radius:20px;font-weight:700;cursor:grab;user-select:none}.chip.s{outline:3px solid #fff}
.zone{display:inline-block;min-width:110px;min-height:38px;border:2px dashed var(--o);border-radius:10px;padding:4px 10px;vertical-align:middle;background:var(--n3);text-align:center}
.zone.ok{border-color:var(--g);border-style:solid}.zone.no{border-color:var(--r);border-style:solid}
.row{margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row b{min-width:110px}
.fb{margin-top:12px;padding:12px;border-radius:12px;background:var(--n3);border-right:6px solid var(--o);line-height:1.8}.fb.ok{border-color:var(--g)}.fb.no{border-color:var(--r)}
.big{font-size:3rem}.mk{font-size:2.2rem;color:var(--o);font-weight:800}
.cert{background:#fffdf5;color:#1a1a2e;border:10px double var(--o);border-radius:6px;padding:26px;text-align:center;margin:14px 0}
.cert h2{color:var(--n);font-size:2rem;margin:.2em}.cert .nm{font-size:1.8rem;color:var(--o);font-weight:800;border-bottom:2px solid var(--n);display:inline-block;padding:0 24px;margin:8px}
input{padding:10px;border-radius:10px;border:2px solid var(--o);font-size:1rem;font-family:inherit;min-width:230px;text-align:center}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;inset:0;margin:0}}
</style></head><body>
